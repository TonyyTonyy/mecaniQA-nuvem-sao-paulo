apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-java-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-api
  template:
    metadata:
      labels:
        app: java-api
    spec:
      containers:
      - name: app-java
        image: mecaniqa-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: mecaniqa-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mecaniqa-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mecaniqa-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: mecaniqa-config
              key: SPRING_DATA_REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: mecaniqa-config
              key: SPRING_DATA_REDIS_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: app-java-service
spec:
  type: NodePort
  selector:
    app: java-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
