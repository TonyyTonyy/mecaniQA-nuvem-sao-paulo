apiVersion: v1
kind: Service
metadata:
  name: mecaniqa-db
spec:
  clusterIP: None
  selector:
    app: mecaniqa-db
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mecaniqa-db
spec:
  serviceName: mecaniqa-db
  replicas: 1
  selector:
    matchLabels:
      app: mecaniqa-db
  template:
    metadata:
      labels:
        app: mecaniqa-db
    spec:
      containers:
      - name: mysql
        image: mecaniqa-db:latest
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mecaniqa-config
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mecaniqa-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mecaniqa-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mecaniqa-secrets
              key: MYSQL_ROOT_PASSWORD
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
